<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<title>VLADJIA · ENDOFTIME</title>

<!-- ── PWA ── -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#07080A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EndOfTime">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<style>
:root{
  --ink:#07080A;
  --panel:#12151B;
  --panel-hi:#181C24;
  --edge:#242A35;
  --legend:#7C858F;
  --white:#E9EDF2;

  --brand:#9E000F;      /* 你 logo 的紅 */
  --brand-hi:#E8402A;

  --red:#E8402A;
  --amber:#F5A623;
  --green:#2FE0A0;
  --blue:#4DA6FF;
  --cyan:#3FD6E8;
  --violet:#B47CFF;
}

@font-face{
  font-family:'Mechsuit';
  src:url('./Mechsuit.otf') format('opentype');
  font-display:swap;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{
  color:var(--white);
  font-family:'Mechsuit',ui-monospace,'Roboto Mono','DIN Alternate',
              'Noto Sans TC','PingFang TC',sans-serif;
  user-select:none;
}

.screen{
  position:fixed;inset:0;
  opacity:0;
  visibility:hidden;          /* 沒顯示就徹底退出，不吃觸碰、也不佔畫面 */
  transition:opacity .45s ease;
  display:flex;flex-direction:column;
  z-index:1;
}
.screen.on{
  opacity:1;
  visibility:visible;
  z-index:2;
}

/* ═══════════ 1 · 點火 ═══════════ */
#boot{align-items:center;justify-content:center}
#shake{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.stack{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
}
/* 家字自己的框：起動鈕、衝擊波、閃光全部以這裡為圓心 */
.markwrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
#shake.hit{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  8%{transform:translate(-7px,4px)}
  18%{transform:translate(6px,-5px)}
  30%{transform:translate(-5px,-3px)}
  44%{transform:translate(4px,3px)}
  60%{transform:translate(-2px,2px)}
  78%{transform:translate(2px,-1px)}
}

/* 起動鈕 */
.starter{
  position:absolute;z-index:10;
  top:50%;left:50%;margin:-79px 0 0 -79px;   /* 158/2，用 margin 置中才不會跟 transform 打架 */
  width:158px;height:158px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#1B1F27,#0B0D11);
  border:2px solid var(--brand-hi);
  color:var(--brand-hi);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 34px rgba(232,64,42,.22), inset 0 0 26px rgba(232,64,42,.12);
  transition:transform .16s ease;
}
.starter:active{transform:scale(.93)}
.starter svg{width:56px;height:56px}
.starter::before{
  content:'';position:absolute;inset:-14px;border-radius:50%;
  border:1px solid var(--brand-hi);opacity:0;
  animation:ring 2.1s ease-out infinite;
}
@keyframes ring{
  0%{transform:scale(.88);opacity:.5}
  70%{opacity:0}
  100%{transform:scale(1.2);opacity:0}
}
.starter.gone{animation:pull .3s ease-in forwards}
@keyframes pull{to{transform:scale(.35);opacity:0}}

#boot .cap{
  position:absolute;bottom:calc(env(safe-area-inset-bottom) + 54px);
  font-size:11px;letter-spacing:.34em;color:var(--legend);
  text-transform:uppercase;transition:opacity .25s ease;
}
#boot .cap.gone{opacity:0}

/* 印章：logo 主體 */
#mark{
  width:min(56vw,218px);height:auto;
  opacity:0;
  transform:scale(1.75);
  filter:blur(9px);
}
#mark.stamp{animation:stamp .5s cubic-bezier(.15,.9,.25,1) forwards,
                       breathe 3.4s 0.6s ease-in-out infinite}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.75);filter:blur(9px)}
  55%{opacity:1;transform:scale(.965);filter:blur(0)}
  78%{transform:scale(1.02)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
@keyframes breathe{
  0%,100%{filter:drop-shadow(0 0 14px rgba(158,0,15,.35))}
  50%{filter:drop-shadow(0 0 30px rgba(232,64,42,.6))}
}

/* END OF TIME：從中央往兩側拉開 */
#eot{
  width:min(76vw,306px);height:auto;
  opacity:0;clip-path:inset(0 50% 0 50%);
}
#eot.wipe{animation:wipe .66s cubic-bezier(.2,.85,.2,1) forwards}
@keyframes wipe{
  0%{opacity:0;clip-path:inset(0 50% 0 50%)}
  22%{opacity:1}
  100%{opacity:1;clip-path:inset(0 0 0 0);
       filter:drop-shadow(0 0 15px rgba(232,64,42,.45))}
}

/* 銘牌 */
#word{
  width:min(42vw,172px);height:auto;
  opacity:0;transform:translateY(16px);
}
#word.up{animation:up .8s ease-out forwards}
@keyframes up{to{opacity:.95;transform:translateY(0)}}

/* 落印衝擊波 */
/* 落印衝擊波：圓心＝家字中心 */
.wave{
  position:absolute;
  top:50%;left:50%;margin:-100px 0 0 -100px;
  width:200px;height:200px;border-radius:50%;
  border:2px solid var(--brand-hi);opacity:0;pointer-events:none;
}
.wave.go{animation:wave .8s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes wave{
  0%{opacity:.85;transform:scale(.25)}
  100%{opacity:0;transform:scale(3.4)}
}
.flash{
  position:absolute;inset:-200%;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(232,64,42,.42),transparent 58%);
  opacity:0;
}
.flash.go{animation:flash .6s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* ═══════════ 2 · 開機終端 ═══════════ */
#term{
  padding:calc(env(safe-area-inset-top) + 40px) 20px
         calc(env(safe-area-inset-bottom) + 30px);
  justify-content:center;
}
/* END OF TIME：三個字各自對上語音的音節 */
#term .eotline{
  display:flex;gap:.5em;align-items:baseline;
  font-size:32px;letter-spacing:.16em;color:var(--white);
  text-transform:uppercase;margin-bottom:16px;line-height:1.1;
  transition:font-size .55s cubic-bezier(.3,.9,.3,1),
             letter-spacing .55s cubic-bezier(.3,.9,.3,1),
             color .55s ease, margin-bottom .55s ease, opacity .55s ease;
}
#term .eotline span{
  display:inline-block;opacity:0;
  transform:scale(1.45);
}
#term .eotline span.hit{animation:word .34s cubic-bezier(.15,.9,.25,1) forwards}
@keyframes word{
  0%{opacity:0;transform:scale(1.45);filter:blur(7px)}
  55%{opacity:1;transform:scale(.96);filter:blur(0);
      text-shadow:0 0 26px var(--brand-hi)}
  100%{opacity:1;transform:scale(1);filter:blur(0);
       text-shadow:0 0 10px rgba(232,64,42,.4)}
}
/* 講完就縮成標頭讓位 */
#term .eotline.small{
  font-size:11px;letter-spacing:.44em;color:var(--legend);
  margin-bottom:12px;opacity:.75;
}
#term .eotline.small span{text-shadow:none}

#term .head{
  font-size:18px;letter-spacing:.14em;color:var(--brand-hi);
  text-transform:uppercase;margin-bottom:18px;line-height:1.4;
  min-height:52px;
  text-shadow:0 0 18px rgba(232,64,42,.45);
}
#term .log{
  font-family:ui-monospace,'Roboto Mono',monospace;
  font-size:11.5px;line-height:2.1;color:#96A0AC;white-space:pre;
}
#term .log .ok{color:var(--green)}
#term .log div{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}}
#term .online{
  margin-top:20px;font-size:15px;letter-spacing:.3em;color:var(--white);
  opacity:0;text-transform:uppercase;
}
#term .online.go{animation:online .5s ease-out forwards}
@keyframes online{
  0%{opacity:0;letter-spacing:.6em;text-shadow:0 0 26px var(--brand-hi)}
  100%{opacity:1;letter-spacing:.3em;text-shadow:0 0 12px rgba(232,64,42,.5)}
}
#term .cur{
  display:inline-block;width:8px;height:13px;background:var(--brand-hi);
  vertical-align:-2px;margin-left:4px;animation:blink .62s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
#term::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(0,0,0,.3) 2px 4px);
  opacity:.5;
}
.skiphint{
  position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 14px);
  font-size:9px;letter-spacing:.24em;color:#3D444E;text-transform:uppercase;z-index:5;
}

/* ═══════════ 3 · 主畫面 ═══════════ */
#dash{padding-top:env(safe-area-inset-top)}

/* 上緣切換列 */
.switch{
  flex:none;display:flex;align-items:center;gap:7px;
  padding:9px 10px 10px;border-bottom:1px solid var(--edge);
}
/* 斜角切角，跟你 logo 的稜角同一個語言 */
.seg{
  flex:1;display:flex;gap:4px;padding:3px;
  background:linear-gradient(180deg,#1A1E26,#0E1116);
  border:1px solid var(--edge);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.seg button{
  position:relative;overflow:hidden;
  flex:1;background:transparent;border:0;
  color:var(--legend);font:inherit;font-size:12px;letter-spacing:.2em;
  padding:10px 0;cursor:pointer;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:color .2s ease;
}
/* 底色獨立一層，才能跟鏡面反光疊在一起 */
.seg button::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(160deg,#7E000C 0%,var(--brand) 42%,#6B000A 100%);
  opacity:0;transition:opacity .22s ease;
}
/* 斜掠而過的鏡面高光 */
.seg button::after{
  content:'';position:absolute;top:0;bottom:0;width:44%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.30),transparent);
  transform:translateX(-160%) skewX(-18deg);
  opacity:0;pointer-events:none;
}
.seg button.on{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.seg button.on::before{opacity:1}
.seg button.on::after{animation:sheen .85s cubic-bezier(.3,.8,.4,1) forwards}
@keyframes sheen{
  0%{opacity:.9;transform:translateX(-160%) skewX(-18deg)}
  100%{opacity:0;transform:translateX(340%) skewX(-18deg)}
}
.seg button:active{transform:translateY(1px)}

.reload{
  flex:0 0 44px;height:44px;color:var(--legend);
  background:linear-gradient(180deg,#1A1E26,#0E1116);
  border:1px solid var(--edge);
  display:grid;place-items:center;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:color .18s ease;
}
.reload:active{color:var(--brand-hi)}
.reload svg{width:18px;height:18px}

/* 兩個分頁 */
.views{flex:1;position:relative;min-height:0}
.view{
  position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .28s ease;
}
.view.on{opacity:1;pointer-events:auto}

/* ── 發射台：六個大格 ── */
.grid{
  flex:1;width:100%;max-width:540px;margin:0 auto;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);
  gap:10px;padding:10px;min-height:0;
}
.tile{
  position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--edge);border-radius:15px;
  color:var(--white);font:inherit;
  display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;
  padding:15px 15px 13px;cursor:pointer;
  opacity:0;transform:translateY(16px);
  transition:transform .13s ease,background .13s ease;
}
.grid.live .tile{animation:tilein .46s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes tilein{to{opacity:1;transform:translateY(0)}}
.tile:active{transform:scale(.955);background:var(--panel-hi)}
.tile:focus-visible{outline:2px solid var(--c);outline-offset:2px}

.tile .lamp{
  width:46px;height:46px;color:var(--c);opacity:.35;
  transition:opacity .18s ease,filter .18s ease;
}
/* 同一個圖示放大當底紋，從右下角溢出去 */
.tile .ghost{
  position:absolute;right:-8%;bottom:-8%;
  width:56%;aspect-ratio:1;color:var(--c);
  opacity:.06;pointer-events:none;
  transition:opacity .18s ease;
}
.tile .ghost svg{width:100%;height:100%;display:block}
.tile:active .ghost{opacity:.15}
.tile.lit .ghost{opacity:.12}
.tile .lamp svg{width:100%;height:100%;display:block}
.tile.lit .lamp,.tile:active .lamp{opacity:1;filter:drop-shadow(0 0 11px var(--c))}
.tile .zh{font-size:20px;font-weight:600;letter-spacing:.08em;line-height:1.15}
.tile .en{font-size:8.5px;letter-spacing:.22em;color:var(--legend);
  text-transform:uppercase;margin-top:4px;display:block}
.tile .txt{text-align:left}
.tile::after{
  content:'';position:absolute;left:0;top:16px;bottom:16px;width:3px;
  background:var(--c);opacity:.25;transition:opacity .18s ease;
}
.tile.lit::after{opacity:.95;box-shadow:0 0 11px var(--c)}
.tile .sweep{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--c),transparent);
  opacity:0;transform:translateX(-100%);
}
.tile.fire .sweep{animation:sweep .44s ease-out}

/* ── 待機掃描：一道光每 5 秒巡過六格 ──
   --scan 註冊成可動畫的數值，亮起快、退場慢，看起來就是滑過去的 */
@property --scan{
  syntax:'<number>';
  initial-value:0;
  inherits:false;
}
.grid.live .tile{
  --scan:0;
  transition:--scan .95s cubic-bezier(.25,.7,.35,1);
}
.grid.live .tile .lamp{
  opacity:calc(.35 + var(--scan) * .55);
  filter:drop-shadow(0 0 calc(var(--scan) * 12px) var(--c));
  transition:opacity .95s ease, filter .95s ease;
}
.grid.live .tile::after{
  opacity:calc(.25 + var(--scan) * .6);
  box-shadow:0 0 calc(var(--scan) * 10px) var(--c);
  transition:opacity .95s ease, box-shadow .95s ease;
}
.grid.live .tile .ghost{
  opacity:calc(.06 + var(--scan) * .07);
  transition:opacity .95s ease;
}
/* 掃過時左上角掠過一抹極淡的暈 */
.tile .glow{
  position:absolute;inset:0;pointer-events:none;border-radius:15px;
  background:radial-gradient(circle at 22% 28%,var(--c),transparent 62%);
  opacity:calc(var(--scan) * .09);
  transition:opacity .95s ease;
}
@keyframes sweep{
  0%{opacity:.55;transform:translateX(-100%)}
  100%{opacity:0;transform:translateX(100%)}
}

/* ── 儀表板分頁 ── */
.stage{flex:1;position:relative;min-height:0;background:var(--ink)}
.stage iframe{width:100%;height:100%;border:0;display:block}
.veil{
  position:absolute;inset:0;display:grid;place-items:center;gap:14px;
  background:var(--ink);text-align:center;padding:26px;
  font-size:11px;letter-spacing:.2em;color:var(--legend);text-transform:uppercase;
  transition:opacity .35s ease;
}
.veil.hide{opacity:0;pointer-events:none}
.veil .bar{width:120px;height:2px;background:var(--edge);overflow:hidden;border-radius:2px}
.veil .bar span{display:block;height:100%;width:36%;background:var(--brand-hi);
  animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.veil .again{
  margin-top:4px;padding:9px 18px;background:transparent;
  border:1px solid var(--brand-hi);border-radius:9px;color:var(--brand-hi);
  font:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;display:none;
}
.veil.stuck .bar{display:none}
.veil.stuck .again{display:block}


.peek{
  position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);
  background:#0B0D11;border:1px solid var(--edge);border-radius:11px;
  padding:12px 14px;font-size:10px;line-height:1.6;color:var(--legend);
  font-family:ui-monospace,monospace;word-break:break-all;
  opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40;
}
.peek.on{opacity:1}
.peek b{color:var(--white);letter-spacing:.16em;margin-right:6px}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<!-- 1 · 點火 -->
<section class="screen on" id="boot">
  <div id="shake">
    <div class="stack">
      <div class="markwrap">
        <div class="flash" id="flash"></div>
        <div class="wave" id="wave"></div>
        <img id="mark" alt="">
        <button class="starter" id="starter" aria-label="啟動">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6v7.2"/><path d="M17.6 5.4a7.6 7.6 0 1 1-11.2 0"/>
          </svg>
        </button>
      </div>
      <img id="eot" alt="">
      <img id="word" alt="">
    </div>
  </div>
  <div class="cap" id="cap">Press to start</div>
</section>

<!-- 2 · 開機終端 -->
<section class="screen" id="term">
  <div class="eotline" id="eotline"><span>END</span><span>OF</span><span>TIME</span></div>
  <div class="head" id="head"></div>
  <div class="log" id="log"></div>
  <div class="online" id="online">All systems online</div>
  <div class="skiphint">Tap to skip</div>
</section>

<!-- 3 · 主畫面 -->
<section class="screen" id="dash">
  <div class="switch">
    <div class="seg">
      <button id="tabLaunch" class="on">式　神</button>
      <button id="tabBoard">業　簿</button>
    </div>
    <button class="reload" id="reload" aria-label="重新載入儀表板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 1 0-2.1 6.2"/><path d="M20 5v6h-6"/></svg>
    </button>
  </div>

  <div class="views">
    <div class="view on" id="vLaunch">
      <div class="grid" id="grid"></div>
    </div>
    <div class="view" id="vBoard">
      <div class="stage">
        <iframe id="frame" title="儀表板" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="veil" id="veil">
          <div>Dashboard uplink</div>
          <div class="bar"><span></span></div>
          <button class="again" id="again">重新連線</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="peek" id="peek"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   ★ 以後只改這一段 ★
   ══════════════════════════════════════════════════════════════ */

const DASHBOARD_URL =
  'https://script.google.com/macros/s/AKfycbxF9x9ZW8dO3x4kNgLVp5bOFut2SzUAopGAgeoXkDUqftRJgxt0O3wH2d2Sgkrc6atVBg/exec';

/* 素材路徑。index.html 跟素材放同一個 repo 就用相對路徑；
   放別的地方就換成 https://raw.githubusercontent.com/vladjia/EndOfTime/main/... */
const ASSET = {
  mark : './mark.png',
  eot  : './eot.png',
  word : './word.png',
  boot : './opening.mp3',
  trans: './EndofTimeinitializingcoresystemssystemsonline.mp3',
};

const APPS = [
  { zh:'胎壓',   en:'Tire Pressure', line:'TIRE PRESSURE MONITOR', c:'red', icon:'tire',
    pkg:'com.zl.dev.tire.king',  cls:'com.zl.dev.tire.ui.LauncherActivity' },
  { zh:'方向',   en:'Signal',        line:'SIGNAL RELAY',          c:'amber', icon:'turn',
    pkg:'com.koso.flasher',      cls:'com.koso.flasher.MainActivity' },
  { zh:'光輪',   en:'Wheel Light',   line:'WHEEL LIGHT ARRAY',     c:'violet', icon:'wheel',
    pkg:'com.szelk.ledlamppro',  cls:'com.szelk.ledlamppro.ui.SplashActivity' },
  { zh:'大燈',   en:'Headlight',     line:'HEADLIGHT MODULE',      c:'blue', icon:'head',
    pkg:'com.ledlamp',           cls:'com.FirstActivity' },
  { zh:'背包',   en:'Top Case',      line:'TOP CASE LINK',         c:'green', icon:'bag',
    pkg:'com.rhxled.led_cp',     cls:'com.rhxled.led_cp.WiFiHelper' },
  { zh:'全車燈', en:'All Lights',    line:'FULL LIGHTING SCENE',   c:'cyan', icon:'beam',
    pkg:'com.spled.scenex',      cls:'com.spled.scenex.MainActivity' },
];

/* 動畫節拍，全部對準你的音檔（單位：毫秒）
   opening.mp3 4.10s：0.10s 一記重擊，之後長殘響
   trans.mp3   6.34s：1.30~2.70s 說 initializing core systems
                      3.30~4.30s 說 systems online              */
const T = {
  impact  : 100,    // 落印（對上重擊）
  eot     : 1050,   // END OF TIME 拉開
  word    : 1780,   // 銘牌浮現
  toTerm  : 3850,   // 切終端機（殘響收尾）
  /* 以下相對於 trans.mp3 開始 */
  eotWords: [130, 510, 620],   // END / OF / TIME 各自的音節起點
  eotSmall: 1040,              // 講完，縮成標頭讓位
  title   : 1300,   // 標題開始打字
  titleMs : 56,     // 每字毫秒（25 字剛好 1.40s，跟語音同步收）
  lines   : 2850,   // 六行檢查開跑
  lineMs  : 108,
  online  : 3600,   // ALL SYSTEMS ONLINE（對上第二句語音）
  toDash  : 5000,
};

const KEYCLICK = true;   // 打字聲，不要就改 false
const KEYVOL   = 0.05;

/* ══════════════════════════════════════════════════════════════ */

const ICONS = {
  tire:'<path d="M5 19v-7a7 7 0 0 1 14 0v7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M12 9v4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.15" fill="currentColor"/>',
  turn:'<path d="M10.5 5.5 4.5 12l6 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 5.5 20.5 12l-6 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  head:'<path d="M4 5.5h5a6.5 6.5 0 0 1 0 13H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M14 8h6M14 12h6M14 16h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  bulb:'<circle cx="12" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.5 17.5h5M10.5 20.5h3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M12 1.5v2M3.6 5.2l1.4 1.4M20.4 5.2 19 6.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  wheel:'<circle cx="12" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5.4v3M12 15.6v3M5.4 12h3M15.6 12h3M7.3 7.3l2.1 2.1M14.6 14.6l2.1 2.1M16.7 7.3l-2.1 2.1M9.4 14.6l-2.1 2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  bag:'<path d="M5.5 9.5h13a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19v-8a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9.5V6.8A3.3 3.3 0 0 1 12 3.5a3.3 3.3 0 0 1 3.5 3.3V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.5 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  beam:'<circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.4v3M12 18.6v3M2.4 12h3M18.6 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  wifi:'<path d="M3.5 8.5a13 13 0 0 1 17 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M6.8 12.4a8.4 8.4 0 0 1 10.4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M9.9 16.1a4 4 0 0 1 4.2 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="19.4" r="1.3" fill="currentColor"/>',
  star:'<path d="M12 2.5 14 10l7.5 2-7.5 2-2 7.5-2-7.5L2.5 12 10 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
};

const SHELL  = (typeof window.WZ !== 'undefined' && typeof WZ.launch === 'function');
const BRIDGE = SHELL || typeof window.AppInventor !== 'undefined';
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FAST   = /[?&]skip=1/.test(location.search);
const $ = id => document.getElementById(id);

const APP_VER = document.lastModified;   /* 自動抓這份 HTML 的最後修改時間 */
let swVer  = '—';
let booted = false;

$('mark').src = ASSET.mark;
$('eot').src  = ASSET.eot;
$('word').src = ASSET.word;

/* ── 音檔 ── */
const aBoot  = new Audio(ASSET.boot);
const aTrans = new Audio(ASSET.trans);
[aBoot, aTrans].forEach(a => { a.preload = 'auto'; a.playsInline = true; });

/* 打字聲用合成的，才不用再多掛一個檔 */
let AC = null;
function click(){
  if(!KEYCLICK) return;
  try{
    if(!AC){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return; AC = new C(); }
    if(AC.state==='suspended') AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type='square'; o.frequency.value = 880 + Math.random()*460;
    g.gain.setValueAtTime(KEYVOL, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+.025);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.04);
  }catch(e){}
}

/* ── 發射台：六個大格 ── */
const peek = $('peek');
let peekTimer = null;
const tiles = [];

APPS.forEach(a => {
  const b = document.createElement('button');
  b.className = 'tile';
  b.style.setProperty('--c', `var(--${a.c})`);
  const svg = ICONS[a.icon] || ICONS.star;
  b.innerHTML =
    `<span class="ghost"><svg viewBox="0 0 24 24">${svg}</svg></span>
     <span class="lamp"><svg viewBox="0 0 24 24">${svg}</svg></span>
     <span class="txt"><span class="zh">${a.zh}</span><span class="en">${a.en}</span></span>
     <span class="glow"></span>
     <span class="sweep"></span>`;

  b.addEventListener('click', () => {
    if(b.dataset.lp === '1'){ b.dataset.lp = '0'; return; }
    fire(a, b);
  });

  let hold = null;
  const down = () => { hold = setTimeout(() => {
    b.dataset.lp = '1';
    peek.innerHTML = `<b>PKG</b>${a.pkg}<br><b>CLS</b>${a.cls}`;
    peek.classList.add('on');
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => peek.classList.remove('on'), 3200);
  }, 480); };
  const up = () => clearTimeout(hold);
  b.addEventListener('touchstart', down, {passive:true});
  b.addEventListener('touchend', up);
  b.addEventListener('touchcancel', up);
  b.addEventListener('mousedown', down);
  b.addEventListener('mouseup', up);
  b.addEventListener('mouseleave', up);

  b.style.animationDelay = (tiles.length * 65) + 'ms';
  tiles.push(b);
  $('grid').appendChild(b);
});

/* 進發射台時：格子依序浮起，六顆燈跑一次自檢 */
let revealed = false;
function revealTiles(){
  if(revealed) return;
  revealed = true;
  $('grid').classList.add('live');
  tiles.forEach((t,i) => {
    setTimeout(() => {
      t.classList.add('lit');
      setTimeout(() => {
        t.classList.remove('lit');
        t.classList.add('ready');      /* 自檢跑完這一格才活過來 */
      }, 420);
    }, 260 + i*65);
  });
}

/* ── 待機掃描 ── */
let scanTimer = null;
function startScan(){
  if (scanTimer) return;
  let i = 0;
  const CYCLE = tiles.length + 4;          /* 六格 + 四拍留白 */
  const step = () => {
    /* 先算這一拍該亮誰，再套用 —— 順序寫反的話最後一格會被清掉 */
    tiles.forEach((t, n) => t.style.setProperty('--scan', n === i ? '1' : '0'));
    i = (i + 1) % CYCLE;
  };
  step();
  scanTimer = setInterval(step, 620);
}

/* ── 兩個分頁切換 ── */
function tab(which){
  const launch = which === 'launch';
  $('vLaunch').classList.toggle('on', launch);
  $('vBoard').classList.toggle('on', !launch);
  $('tabLaunch').classList.toggle('on', launch);
  $('tabBoard').classList.toggle('on', !launch);
  click();
}
$('tabLaunch').addEventListener('click', () => tab('launch'));
$('tabBoard').addEventListener('click',  () => tab('board'));

/* ── 重載鈕 ── */
const reload = $('reload');
reload.addEventListener('click', () => {
  if(reload.dataset.lp==='1'){ reload.dataset.lp='0'; return; }
  tab('board'); loadDash();
});

/* 長按重載鈕 = 對暗號 + 強制清快取重來 */
let rHold = null;
const rDown = () => { rHold = setTimeout(() => {
  reload.dataset.lp = '1';
  askVer();
  const match = (swVer === APP_VER);
  peek.innerHTML =
    `<b>APP</b>${APP_VER}<br><b>SW</b>${swVer} ${match ? '✅ 對上了' : '⚠️ 沒對上'}` +
    `<br><b>放開</b>${match ? '無事發生' : '會清快取重來'}`;
  peek.classList.add('on');
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => peek.classList.remove('on'), 4000);
}, 700); };
const rUp = () => {
  clearTimeout(rHold);
  if (reload.dataset.lp === '1' && swVer !== APP_VER){
    const c = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (c) c.postMessage({ type:'PURGE' });
    setTimeout(() => location.reload(), 400);
  }
};
reload.addEventListener('touchstart', rDown, {passive:true});
reload.addEventListener('touchend', rUp);
reload.addEventListener('touchcancel', () => clearTimeout(rHold));
reload.addEventListener('mousedown', rDown);
reload.addEventListener('mouseup', rUp);
reload.addEventListener('mouseleave', () => clearTimeout(rHold));

function fire(app, el){
  if (Date.now() < armedAt) return;      /* 剛進畫面，這一下是殘留的觸碰 */
  if (!el.classList.contains('ready')) return;
  el.classList.remove('fire'); void el.offsetWidth; el.classList.add('fire');
  click();
  if(!BRIDGE){
    peek.innerHTML = `<b>測試模式</b>未接發射器<br><b>PKG</b>${app.pkg}`;
    peek.classList.add('on');
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => peek.classList.remove('on'), 2600);
    return;
  }
  if (SHELL){
    const r = WZ.launch(app.pkg, app.cls);
    if (r !== 'OK'){
      peek.innerHTML = `<b>${app.zh}</b>${r}`;
      peek.classList.add('on');
      clearTimeout(peekTimer);
      peekTimer = setTimeout(() => peek.classList.remove('on'), 4000);
    }
    return;
  }
  /* 舊的 App Inventor 殼還留著相容，尾巴的時間戳必留 */
  window.AppInventor.setWebViewString(app.pkg + '|' + app.cls + '|' + Date.now());
}

/* ── 儀表板 ── */
let watchdog = null;
function loadDash(){
  const v = $('veil'), f = $('frame');
  v.classList.remove('hide','stuck');
  clearTimeout(watchdog);
  watchdog = setTimeout(() => v.classList.add('stuck'), 12000);
  f.src = DASHBOARD_URL + (DASHBOARD_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
}
$('frame').addEventListener('load', () => {
  clearTimeout(watchdog); $('veil').classList.add('hide');
});
$('again').addEventListener('click', loadDash);

/* ── 流程 ── */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
}
let seq = [], done = false;
let armedAt = 0;          /* 進發射台後這段時間內不接受發射，擋誤觸 */
function at(ms, fn){ seq.push(setTimeout(fn, ms)); }
function finish(){
  if(done) return;
  done = true;
  seq.forEach(clearTimeout); seq = [];
  try{ aBoot.pause(); }catch(e){}
  try{ fade(aTrans); }catch(e){}
  show('dash'); loadDash();
  revealTiles();
  armedAt = Date.now() + 900;     /* 0.9 秒內的觸碰一律無效 */
  setTimeout(startScan, 1400);    /* 等進場自檢跑完才開始巡 */
}
function fade(a){
  if(a.paused) return;
  const s = setInterval(() => {
    a.volume = Math.max(0, a.volume - .12);
    if(a.volume <= .01){ clearInterval(s); a.pause(); }
  }, 45);
}

/* 不用 once，免得被幽靈事件用掉；改用 pointerdown 反應也快 */
$('starter').addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  ignite();
});

function ignite(){
  booted = true;
  loadDash();                     /* 儀表板背景先偷跑，吃掉 GAS 冷啟動 */

  /* 這一下手指觸碰是唯一能解開音訊的時機，兩個音檔都要在這裡點過名 */
  aBoot.play().catch(()=>{});
  aTrans.play().then(() => { aTrans.pause(); aTrans.currentTime = 0; }).catch(()=>{});

  $('starter').classList.add('gone');
  $('cap').classList.add('gone');

  if(FAST || REDUCE){ finish(); return; }

  at(T.impact, () => {
    $('mark').classList.add('stamp');
    $('wave').classList.add('go');
    $('flash').classList.add('go');
    $('shake').classList.add('hit');
  });
  at(T.eot,    () => $('eot').classList.add('wipe'));
  at(T.word,   () => $('word').classList.add('up'));
  at(T.toTerm, () => { show('term'); runTerminal(); });

  /* 動畫跑起來之後才開放點畫面跳過，免得起動那一下就被自己跳掉 */
  at(700, () => {
    $('boot').addEventListener('click', finish);
    $('term').addEventListener('click', finish);
  });
}

function runTerminal(){
  aTrans.volume = 1;
  aTrans.currentTime = 0;
  aTrans.play().catch(()=>{});

  const head = $('head'), log = $('log');
  const title = 'INITIALIZING CORE SYSTEMS';

  /* 語音先唸 END OF TIME，三個字各自對上音節 */
  const words = [...$('eotline').children];
  T.eotWords.forEach((ms, i) => at(ms, () => {
    words[i].classList.add('hit');
    click();
  }));
  at(T.eotSmall, () => $('eotline').classList.add('small'));

  /* 標題逐字，收在語音第一句講完的同一刻 */
  [...title].forEach((ch, i) => {
    at(T.title + i * T.titleMs, () => {
      head.textContent += ch;
      if(ch !== ' ') click();
    });
  });

  /* 六行系統檢查，快速滾過 */
  APPS.forEach((a, i) => {
    at(T.lines + i * T.lineMs, () => {
      const row = document.createElement('div');
      const pad = '.'.repeat(Math.max(3, 30 - a.line.length));
      row.innerHTML = '&gt; ' + a.line + ' ' + pad + ' <span class="ok">OK</span>';
      log.appendChild(row);
      click();
    });
  });

  /* 對上語音第二句 */
  at(T.online, () => {
    $('online').classList.add('go');
    $('online').innerHTML = 'All systems online<span class="cur"></span>';
  });

  at(T.toDash, finish);
}

/* ══════════════════════════════════════════════════════════════
   PWA 自動更新
   ① updateViaCache:'none' → sw.js 絕不吃 HTTP 快取
   ② 每次載入 + 每次切回前景都主動 update()
   ③ 新 SW 接手時才重載，而且只在還沒按下起動鈕前重載，不打斷動畫
   裝在 App Inventor 的 WebViewer 裡不註冊，那邊不需要
   ══════════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator && !BRIDGE && location.protocol === 'https:'){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    if (!hadController) return;        // 第一次安裝，不用重載
    if (booted) { swVer = '待重開'; return; }   // 動畫跑了就不打斷，下次開自然是新版
    reloading = true;
    location.reload();
  });

  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'VER') swVer = e.data.ver;
  });

  window.addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' });
      reg.update().catch(()=>{});
      askVer();
      /* 切回前景就再問一次有沒有新版 */
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden){ reg.update().catch(()=>{}); askVer(); }
      });
      setInterval(() => reg.update().catch(()=>{}), 30 * 60 * 1000);
    }catch(e){}
  });
}

function askVer(){
  const c = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (c) c.postMessage({ type:'VER' });
}
</script>
